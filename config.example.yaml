# =======================================================
# 多平台便签导出工具配置文件示例 (Note Exporter Config Example)
# =======================================================

# 导出的根目录
output_dir: "./export_output"

# -------------------------------------------------------
# 1. 小米便签 (i.mi.com)
# -------------------------------------------------------
xiaomi:
  # 获取方法：电脑浏览器访问 https://i.mi.com 登录后，按 F12 -> 网络 (Network) -> 点击任意请求 -> 复制请求头中的 Cookie 字符串
  cookie: ""
  # 或者填写 serviceToken 与 userId
  service_token: ""
  user_id: ""

# -------------------------------------------------------
# 2. OPPO 便签 (cloud.heytap.com)
# -------------------------------------------------------
oppo:
  # 获取方法：电脑浏览器访问 https://cloud.heytap.com 登录后，按 F12 复制 Cookie 字符串
  cookie: ""
  # 或：若手机已备份导出过 HTML/TXT 文件，可直接填写本地文件夹路径
  export_path: ""

# -------------------------------------------------------
# 3. vivo 便签 (yun.vivo.com)
# -------------------------------------------------------
vivo:
  # 获取方法：电脑浏览器访问 https://yun.vivo.com 登录后，按 F12 复制 Cookie 字符串
  cookie: ""
  # 或：本地已备份导出的文件夹路径
  export_path: ""

# -------------------------------------------------------
# 4. Apple 备忘录 (iCloud)
# -------------------------------------------------------
apple:
  apple_id: ""
  password: ""
  # 或：本地导出的 Apple Notes 文件夹路径 (支持 .html / .md / .txt)
  export_path: ""

# -------------------------------------------------------
# 5. Google Keep
# -------------------------------------------------------
google:
  # 方式 A (推荐免密码)：使用 Google Takeout (takeout.google.com) 导出的 Keep 文件夹路径
  takeout_path: ""
  # 方式 B (在线)：Google 账号与应用专用密码 (需在 Google 账户安全性中生成 App Password)
  username: ""
  password: ""
